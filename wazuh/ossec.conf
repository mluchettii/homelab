<!-- Wazuh server configuration -->
<!-- /var/ossec/etc/ossec.conf -->

<ossec_config>

  <!-- File integrity monitoring -->
  <syscheck>
    <disabled>no</disabled>

    <!-- Monitor entire /home with real-time and hash checking -->
    <directories check_all="yes" realtime="yes">/home</directories>

    <!-- Ignore noisy directories -->
    <ignore>/home/*/Downloads</ignore>
    <ignore>/home/*/Cache</ignore>
    <ignore>/home/*/Temporary Items</ignore>

    <!-- Increase FIM database limit -->
    <file_limit>
      <enabled>yes</enabled>
      <entries>500000</entries>
    </file_limit>
  </syscheck>

  <!-- VirusTotal integration -->
  <integration>
    <name>virustotal</name>
    <api_key>VT_API_KEY</api_key>
    <group>syscheck</group>
    <alert_format>json</alert_format>
  </integration>

  <!-- Custom n8n webhook integration -->
  <integration>
    <name>custom-n8n</name>
    <hook_url>https://n8n.ts.mydomain.com/webhook/YOUR_WEBHOOK_PATH</hook_url>
    <level>9</level>
    <alert_format>json</alert_format>
  </integration>

</ossec_config>
