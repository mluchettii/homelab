# Apache Guacamole — clientless remote desktop gateway
# Supports VNC, RDP, and SSH via HTML5.
#
# Architecture:
#   guacd      — protocol proxy (VNC/RDP/SSH)
#   postgres   — user/connection metadata store
#   guacamole  — web application (served behind a reverse proxy)
#
# The embedded nginx service is commented out; use your own reverse proxy
# (e.g. the repo's nginx service) and uncomment the port mapping below.

networks:
  guacnetwork:
    driver: bridge

services:
  guacd:
    container_name: guacd
    image: guacamole/guacd:1.6.0
    networks:
      - guacnetwork
    restart: always
    volumes:
      - ${GUAC_DRIVE_DIR:-./drive}:/drive:rw
      - ${GUAC_RECORD_DIR:-./record}:/record:rw

  postgres:
    container_name: postgres_guacamole
    environment:
      PGDATA: /var/lib/postgresql/data/guacamole
      POSTGRES_DB: guacamole_db
      POSTGRES_PASSWORD: ${GUAC_DB_PASSWORD}
      POSTGRES_USER: ${GUAC_DB_USER}
    image: postgres:15.2-alpine
    networks:
      - guacnetwork
    restart: always
    volumes:
      - ./init:/docker-entrypoint-initdb.d:z
      - ${GUAC_PGDATA_DIR:-./pgdata}:/var/lib/postgresql/data:Z

  guacamole:
    container_name: guacamole
    group_add:
      - "1000"
    depends_on:
      - guacd
      - postgres
    environment:
      GUACD_HOSTNAME: guacd
      POSTGRESQL_DATABASE: guacamole_db
      POSTGRESQL_HOSTNAME: postgres
      POSTGRESQL_PASSWORD: ${GUAC_DB_PASSWORD}
      POSTGRESQL_USERNAME: ${GUAC_DB_USER}
      RECORDING_SEARCH_PATH: /record
      # OpenID SSO (optional — set when using authentik or another IdP)
      OPENID_ENABLED: ${GUAC_OPENID_ENABLED:-false}
      OPENID_AUTHORIZATION_ENDPOINT: ${GUAC_OPENID_AUTH_ENDPOINT}
      OPENID_CLIENT_ID: ${GUAC_OPENID_CLIENT_ID}
      OPENID_ISSUER: ${GUAC_OPENID_ISSUER}
      OPENID_JWKS_ENDPOINT: ${GUAC_OPENID_JWKS}
      OPENID_REDIRECT_URI: ${GUAC_OPENID_REDIRECT}
      OPENID_USERNAME_CLAIM_TYPE: preferred_username
      EXTENSION_PRIORITY: openid
    image: guacamole/guacamole:1.6.0
    networks:
      - guacnetwork
    volumes:
      - ${GUAC_RECORD_DIR:-./record}:/record:rw
    ports:
      - "${GUAC_WEB_PORT:-8040}:8080"
